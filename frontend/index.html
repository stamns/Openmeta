<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenMeta 聚合搜索</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
      .toast {
        position: fixed;
        bottom: 20px;
        right: 20px;
        max-width: 400px;
        padding: 16px;
        border-radius: 8px;
        background: #333;
        color: white;
        z-index: 1000;
        animation: slideIn 0.3s ease-out;
        margin-top: 10px;
      }

      .toast.success {
        background: #10b981;
      }

      .toast.error {
        background: #ef4444;
      }

      .toast.warning {
        background: #f59e0b;
      }

      @keyframes slideIn {
        from {
          transform: translateX(400px);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      .spinner {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid #f3f3f3;
        border-top: 3px solid #3498db;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .toast-stack {
        position: fixed;
        bottom: 20px;
        right: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 1000;
      }

      .toast-stack .toast {
        position: static;
        margin-top: 0;
      }
    </style>
  </head>
  <body class="bg-gray-50 text-gray-800">
    <div id="app"></div>
    <script>
      const { createApp, ref, computed } = Vue

      createApp({
        setup() {
          const keyword = ref('')
          const results = ref([])
          const loading = ref(false)
          const searched = ref(false)
          const toasts = ref([])

          const DEBUG = false

          const getApiBase = () => {
            if (typeof window.__API_URL__ === 'string' && window.__API_URL__.trim()) {
              return window.__API_URL__.trim()
            }
            return '/api/search'
          }

          const showToast = (message, type = 'info', duration = 3000) => {
            const id = `${Date.now()}-${Math.random().toString(16).slice(2)}`
            const toast = { id, message, type }
            toasts.value.push(toast)

            setTimeout(() => {
              toasts.value = toasts.value.filter((t) => t.id !== id)
            }, duration)
          }

          const validateResult = (item) => {
            if (!item || typeof item !== 'object') return false
            if (!item.title || !item.url || !item.source) return false
            if (typeof item.title !== 'string' || !item.title.trim()) return false
            if (typeof item.url !== 'string' || !item.url.trim()) return false
            if (typeof item.source !== 'string' || !item.source.trim()) return false
            return true
          }

          const buildSearchUrl = (q) => {
            const base = getApiBase()
            try {
              const url = new URL(base, window.location.origin)
              url.searchParams.set('q', q)
              return url.toString()
            } catch (e) {
              return `/api/search?q=${encodeURIComponent(q)}`
            }
          }

          const readErrorMessage = async (res) => {
            const contentType = res.headers.get('content-type') || ''
            if (contentType.includes('application/json')) {
              const data = await res.json().catch(() => null)
              if (data && typeof data === 'object') {
                return data.message || data.error || data.detail || null
              }
              return null
            }
            const text = await res.text().catch(() => '')
            return text?.trim() || null
          }

          const doSearch = async () => {
            const q = keyword.value?.trim() || ''
            if (!q) {
              showToast('请输入搜索关键词', 'warning')
              return
            }

            loading.value = true
            results.value = []
            searched.value = true

            const requestTimeoutMs = 15000
            const url = buildSearchUrl(q)

            const controller = new AbortController()
            const timeoutId = setTimeout(() => controller.abort(), requestTimeoutMs)

            try {
              const res = await fetch(url, {
                method: 'GET',
                headers: { Accept: 'application/json' },
                signal: controller.signal
              })

              if (!res.ok) {
                const msg = (await readErrorMessage(res)) || `HTTP ${res.status}`
                throw new Error(msg)
              }

              const data = await res.json()

              if (!data || typeof data !== 'object') {
                throw new Error('服务器返回无效数据')
              }

              if (data.warning) {
                showToast(String(data.warning), 'warning', 5000)
              }

              if (data.error) {
                showToast(String(data.error), 'error', 5000)
                results.value = []
                return
              }

              const items = Array.isArray(data.items) ? data.items : []
              const validResults = items.filter(validateResult)

              results.value = validResults

              if (validResults.length === 0) {
                showToast('未找到相关资源，请尝试其他关键词', 'warning')
              }
            } catch (error) {
              if (error?.name === 'AbortError') {
                showToast('搜索超时，请稍候重试...', 'error')
              } else if (error instanceof TypeError) {
                showToast('网络连接失败，请检查网络', 'error')
              } else if (error instanceof SyntaxError) {
                showToast('服务器返回无效数据', 'error')
              } else {
                showToast(error?.message || '搜索失败，请稍候重试', 'error')
              }

              if (DEBUG) {
                console.error('[OpenMeta Error]', error)
              }
            } finally {
              clearTimeout(timeoutId)
              loading.value = false
            }
          }

          const openLink = (item) => {
            const url = item?.url
            if (!url || typeof url !== 'string' || !url.trim()) {
              showToast('链接无效，无法打开', 'warning')
              return
            }

            try {
              new URL(url)
            } catch (e) {
              showToast('链接格式不正确', 'warning')
              return
            }

            window.open(url, '_blank', 'noopener,noreferrer')
          }

          return { keyword, results, loading, searched, doSearch, openLink, toasts }
        },
        template: `
          <div class="max-w-3xl mx-auto px-4 py-10">
            <div class="text-center mb-10">
              <h1 class="text-4xl font-bold text-indigo-600 mb-2">OpenMeta</h1>
              <p class="text-gray-500">全网资源聚合 · 极速直达</p>
            </div>

            <div class="flex shadow-lg rounded-lg overflow-hidden mb-8">
              <input
                v-model="keyword"
                @keyup.enter="doSearch"
                type="text"
                class="flex-1 px-6 py-4 outline-none text-lg"
                placeholder="搜索电影、电视剧、资料..."
              />
              <button
                @click="doSearch"
                class="bg-indigo-600 text-white px-8 py-4 transition font-bold flex items-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed"
                :class="loading ? '' : 'hover:bg-indigo-700'"
                :disabled="loading"
              >
                <span v-if="loading" class="spinner"></span>
                {{ loading ? '搜索中...' : '搜索' }}
              </button>
            </div>

            <div v-if="results.length > 0" class="space-y-4">
              <div class="text-gray-600 mb-4">
                找到 <span class="font-bold">{{ results.length }}</span> 条结果
              </div>
              <div
                v-for="(item, index) in results"
                :key="index"
                class="bg-white p-5 rounded-lg shadow hover:shadow-md transition border-l-4"
                :class="item.source === '夸克' ? 'border-indigo-500' : 'border-gray-300'"
              >
                <div class="flex justify-between items-start">
                  <div class="flex-1 min-w-0">
                    <h3 class="font-bold text-lg mb-1 truncate">{{ item.title }}</h3>
                    <p class="text-sm text-gray-400">{{ item.description || '' }}</p>
                  </div>
                  <span
                    class="text-xs px-2 py-1 rounded ml-2 whitespace-nowrap"
                    :class="item.source === '夸克' ? 'bg-indigo-100 text-indigo-800' : 'bg-gray-100 text-gray-600'"
                  >
                    {{ item.source }}
                  </span>
                </div>

                <button
                  @click="openLink(item)"
                  class="mt-4 w-full py-2 rounded border border-indigo-600 text-indigo-600 hover:bg-indigo-50 text-sm font-medium transition"
                >
                  {{ item.source === '夸克' ? '保存到云盘 (推荐)' : '打开链接' }}
                </button>
              </div>
            </div>

            <div v-if="searched && results.length === 0 && !loading" class="text-center text-gray-400 mt-10">
              <p class="mb-2">😕 未找到相关资源</p>
              <p class="text-sm">请尝试更换关键词或检查网络连接</p>
            </div>

            <div v-if="loading && searched" class="text-center mt-10">
              <div class="inline-block spinner"></div>
              <p class="text-gray-500 mt-4">正在搜索中...</p>
            </div>

            <div class="toast-stack" v-if="toasts.length">
              <div v-for="toast in toasts" :key="toast.id" :class="['toast', toast.type]">
                {{ toast.message }}
              </div>
            </div>
          </div>
        `
      }).mount('#app')
    </script>
  </body>
</html>
