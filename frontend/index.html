<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OpenMeta - 网盘聚合搜索引擎" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">
    <title>OpenMeta - 聚合搜索</title>
    <!-- Prevent FOUC (Flash of Unstyled Content) by applying theme before CSS loads -->
    <script>
      (function() {
        try {
          var STORAGE_KEY = 'openmeta-theme';
          var stored = window.localStorage.getItem(STORAGE_KEY);
          var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = (stored === 'dark' || stored === 'light') ? stored : (isDark ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          // Fallback to light theme if localStorage is not available
          document.documentElement.dataset.theme = 'light';
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
    <link rel="stylesheet" href="/src/styles/index.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
