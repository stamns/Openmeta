name: openmeta

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    profiles: ["redis"]

  redis-backup:
    image: redis:7-alpine
    depends_on:
      - redis
    command: ["sh", "-c", "redis-cli -h redis --rdb /backup/dump.rdb"]
    volumes:
      - backup-data:/backup
    logging: *default-logging
    profiles: ["backup"]

volumes:
  redis-data:
  backup-data:
